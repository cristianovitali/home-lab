---
# OPT-IN MUTATING ACTION: starts a backup wrapper already deployed privately.
# No credential/endpoint configuration is copied or generated by this playbook.
- name: Launch existing VPS host-level PBS backup script on request only
  hosts: vps
  gather_facts: false
  become: true
  serial: 1
  vars:
    backup_execute: false
    vps_backup_script: /usr/local/sbin/backup-to-pbs
  tasks:
    - name: Provide actionable diagnostic context if this host requires a reboot
      ansible.builtin.include_tasks: ../tasks/reboot-notification-context.yml

    - name: Require deliberate confirmation and prohibit check-mode execution
      ansible.builtin.assert:
        that:
          - backup_execute | bool
          - not ansible_check_mode
        fail_msg: >-
          Backup not started. Target each VPS explicitly and pass
          -e backup_execute=true only after reviewing active schedules.

    - name: Inspect existing local wrapper without reading secrets
      ansible.builtin.stat:
        path: "{{ vps_backup_script }}"
      register: backup_wrapper

    - name: Refuse missing or non-executable wrappers
      ansible.builtin.assert:
        that:
          - backup_wrapper.stat.exists
          - backup_wrapper.stat.executable
        fail_msg: Install and validate the actual backup wrapper privately first.

    - name: Execute pre-existing backup wrapper
      ansible.builtin.command:
        argv:
          - "{{ vps_backup_script }}"
      async: 7200
      poll: 20
      register: backup_result
      changed_when: backup_result.rc == 0
      no_log: true

    - name: Report completion without secrets or repository metadata
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: existing host backup wrapper completed successfully."
