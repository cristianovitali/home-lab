---
# Read-only preflight. TARGET: each explicitly selected inventory host.
- name: Inventory and operating-system preflight
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Provide actionable diagnostic context if this host requires a reboot
      ansible.builtin.include_tasks: ../tasks/reboot-notification-context.yml

    - name: Confirm supported Linux target
      ansible.builtin.assert:
        that:
          - ansible_facts.system == 'Linux'
        fail_msg: This public reference automation is for Linux targets only.

    - name: Summarize non-sensitive platform information
      ansible.builtin.debug:
        msg:
          - "Inventory alias: {{ inventory_hostname }}"
          - "OS family: {{ ansible_facts.os_family }}"
          - "OS release: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          - "Kernel: {{ ansible_facts.kernel }}"
